<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- DAY ONE, the pre-registration reward's icon in Play Console (512x512, rendered to day-one-icon.png):
       the app icon's glowing cell in ZERO DAY's gold, [1] for day one, the four DAY ONE themes' colors under it -->
  <defs>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="warm" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#2a2110"/>
      <stop offset="1" stop-color="#0b0a08"/>
    </radialGradient>
    <linearGradient id="foil" x1="0" x2="1">
      <stop offset="0" stop-color="#45f0d6"/>
      <stop offset="0.5" stop-color="#b98cff"/>
      <stop offset="1" stop-color="#ffd57a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#warm)"/>
  <rect x="121" y="64" width="270" height="270" rx="20" fill="#17130a" stroke="#f5c542" stroke-width="12" filter="url(#glow)"/>
  <text x="256" y="245" text-anchor="middle" font-family="Courier New, Courier, monospace" font-weight="bold" font-size="124" letter-spacing="-8" fill="#f5c542" filter="url(#glow)">[1]</text>
  <g filter="url(#glow)">
    <rect x="121" y="366" width="60" height="16" rx="8" fill="#f5c542"/>
    <rect x="191" y="366" width="60" height="16" rx="8" fill="url(#foil)"/>
    <rect x="261" y="366" width="60" height="16" rx="8" fill="#8fe6ff"/>
    <rect x="331" y="366" width="60" height="16" rx="8" fill="#ffb59e"/>
  </g>
  <text x="256" y="462" text-anchor="middle" font-family="Courier New, Courier, monospace" font-weight="bold" font-size="60" letter-spacing="6" fill="#ffe08a" filter="url(#glow)">DAY ONE</text>
</svg>
