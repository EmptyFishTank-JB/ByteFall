# ANDROID RELEASE BUNDLE: ByteFall for Google Play, the RELEASE edition (com.emptyfishtank.bytefall:
# no UNLOCK EVERYTHING, every dev switch off; tools/build-app.js release). Runs only by hand:
# Actions → Android release bundle → Run workflow. The .aab is on the run's page under Artifacts (a
# zip: unzip it), to upload in the Play Console (a testing track or production → Create new
# release). Signed with ByteFall's UPLOAD KEY, from four repository secrets (Settings → Secrets and
# variables → Actions): UPLOAD_KEYSTORE_BASE64 (the keystore file, base64), UPLOAD_KEYSTORE_PASSWORD,
# UPLOAD_KEY_ALIAS and UPLOAD_KEY_PASSWORD (the README's "Releasing to Google Play" makes them).
# Google Play re-signs it with the app signing key it keeps. Its version code is the game's build
# number (index.html's ?v=): each upload needs a higher one than the last, so push before each.
name: Android release bundle

on:
  workflow_dispatch: # (only by hand: Actions → Android release bundle → Run workflow)

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: The upload key's secrets are set
        env:
          KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing UPLOAD_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing UPLOAD_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing UPLOAD_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing UPLOAD_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings → Secrets and variables → Actions; the README's Releasing to Google Play)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm ci

      - name: Build the RELEASE edition of the game (www/)
        run: node tools/build-app.js release

      - name: Test ads? (js/ads-config.js)
        run: |
          if grep -q "testing: *true" js/ads-config.js; then
            echo "::warning::js/ads-config.js has testing: true, so this bundle shows TEST ads only: fine for a testing track, not for production"
          fi

      - name: Create the Android project
        run: |
          npx cap add android
          node tools/setup-android.js
          npx @capacitor/assets generate --android --assetPath tools/android/res \
            --iconBackgroundColor '#020403' --iconBackgroundColorDark '#020403' \
            --splashBackgroundColor '#020403' --splashBackgroundColorDark '#020403'
          npx cap sync android

      - name: The upload key, for this run only
        env:
          KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build the bundle
        working-directory: android
        env:
          BYTEFALL_UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.jks
          BYTEFALL_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          BYTEFALL_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          BYTEFALL_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Signed, and named
        id: name
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" | grep -q "jar verified" || { echo "::error::The bundle isn't signed"; exit 1; }
          BUILD=$(grep -o '?v=[0-9]*' index.html | head -1 | cut -d= -f2)
          echo "file=ByteFall-release-v${BUILD}-${GITHUB_SHA::7}.aab" >> "$GITHUB_OUTPUT"
          cp "$AAB" "ByteFall-release-v${BUILD}-${GITHUB_SHA::7}.aab"

      - name: Release checks (the Play package, billing, no OTHER APPS or microphone, no dev padlock)
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          M=$(unzip -p "$AAB" base/manifest/AndroidManifest.xml | tr -c '[:print:]' '\n')
          echo "$M" | grep -q "com.emptyfishtank.bytefall" || { echo "::error::The package name isn't in the manifest"; exit 1; }
          # (Google Play's billing: Play Console only lets products be made once a bundle with it is uploaded)
          echo "$M" | grep -q "com.android.vending.BILLING" || { echo "::error::The BILLING permission isn't in the manifest (Google Play's billing library missing?)"; exit 1; }
          for bad in bytefall.test CaptureService RECORD_AUDIO MODIFY_AUDIO_SETTINGS FOREGROUND_SERVICE; do
            if echo "$M" | grep -q "$bad"; then echo "::error::The release manifest has $bad"; exit 1; fi
          done
          if unzip -p "$AAB" base/assets/public/index.html | grep -q "dev-unlock-btn"; then echo "::error::The UNLOCK EVERYTHING padlock is in the release page"; exit 1; fi
          echo "Permissions the app asks for: $(echo "$M" | grep -o 'android\.permission\.[A-Z_]*\|com\.google\.android\.gms\.permission\.[A-Z_]*\|com\.android\.vending\.BILLING' | sort -u | tr '\n' ' ')"

      - name: The upload key, gone
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.file }}
          path: ${{ steps.name.outputs.file }}
          retention-days: 30
