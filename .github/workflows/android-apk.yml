# ANDROID TEST APK: the game built as an Android app (Capacitor), the TEST edition: BYTEFALL TEST
# (com.emptyfishtank.bytefall.test), its own app beside the Google Play one, with UNLOCK EVERYTHING
# (the Play build is Actions → Android release bundle). Runs only by hand: Actions → Android test
# APK → Run workflow. The APK is on the run's page under Artifacts (a zip: unzip it and install the
# .apk on the phone). Test-signed (tools/android/test.keystore): each one installs over the last. SOURCE: live (the default) loads the game from GitHub Pages each time it opens,
# so pushes show up without a new APK (tools/live-app.js); bundled has its own copy, as players
# would get it (no dev page).
name: Android test APK

on:
  workflow_dispatch: # (only by hand: Actions → Android test APK → Run workflow)
    inputs:
      source:
        description: 'live: loads the game from GitHub Pages (pushes show up without a new APK); bundled: its own copy'
        type: choice
        options: [live, bundled]
        default: live

concurrency:
  group: android-apk
  cancel-in-progress: true # (a newer run replaces one still going)

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm ci

      - name: Build the TEST edition of the game (www/)
        run: node tools/build-app.js test

      - name: LIVE - load the game from GitHub Pages
        if: inputs.source != 'bundled'
        run: node tools/live-app.js config

      - name: Create the Android project
        run: |
          npx cap add android
          node tools/setup-android.js
          if [ "${{ inputs.source }}" != "bundled" ]; then node tools/live-app.js android; fi
          npx @capacitor/assets generate --android --assetPath tools/android/res \
            --iconBackgroundColor '#020403' --iconBackgroundColorDark '#020403' \
            --splashBackgroundColor '#020403' --splashBackgroundColorDark '#020403'
          npx cap sync android

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name it
        id: name
        run: |
          BUILD=$(grep -o '?v=[0-9]*' index.html | head -1 | cut -d= -f2)
          KIND=$([ "${{ inputs.source }}" = "bundled" ] && echo test || echo live)
          echo "file=ByteFall-${KIND}-v${BUILD}-${GITHUB_SHA::7}.apk" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/debug/app-debug.apk "ByteFall-${KIND}-v${BUILD}-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.file }}
          path: ${{ steps.name.outputs.file }}
          retention-days: 14
